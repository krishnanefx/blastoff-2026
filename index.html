<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141414">

  <title>Blastoff! 2026 — UKSSC</title>
  <meta name="description" content="Blastoff! 2026, the UKSSC's flagship careers event for overseas Singaporean students. 14 August 2026, 13:00–18:00, Suntec Convention Centre Level 3. Free admission.">

  <!-- Share card. These MUST be absolute URLs — most scrapers reject relative
       ones outright, and the few that resolve them composite a transparent PNG
       onto white. og-blastoff-2026.png is 1200x630 on the brand background.
       Regenerate with tools/make-og-image.py; if you change the artwork, give
       the file a NEW name, because Facebook, WhatsApp and LinkedIn all cache
       the image per-URL and will keep serving the old one otherwise. -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://krishnanefx.github.io/blastoff-2026/">
  <meta property="og:site_name" content="UKSSC">
  <meta property="og:title" content="Blastoff! 2026 — UKSSC">
  <meta property="og:description" content="To new heights: bigger, better, bolder! 14 August 2026 at Suntec Convention Centre. Free admission.">
  <meta property="og:image" content="https://krishnanefx.github.io/blastoff-2026/assets/og-blastoff-2026.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Blastoff! 2026 — 14 August 2026, Suntec Convention Centre. Free admission.">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Blastoff! 2026 — UKSSC">
  <meta name="twitter:description" content="To new heights: bigger, better, bolder! 14 August 2026 at Suntec Convention Centre. Free admission.">
  <meta name="twitter:image" content="https://krishnanefx.github.io/blastoff-2026/assets/og-blastoff-2026.png">

  <link rel="canonical" href="https://krishnanefx.github.io/blastoff-2026/">
  <link rel="icon" href="./assets/ukssc-crest.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="./assets/fonts/open-sauce-sans-700.woff2" as="font" type="font/woff2" crossorigin>

  <style>
    html, body { margin: 0; padding: 0; background: #141414; }
    /* Reserve the fold so the yellow wordmark doesn't flash against white. */
    ukssc-blastoff:not(:defined) { display: block; min-height: 100vh; }
  </style>
</head>
<body>
  <ukssc-blastoff></ukssc-blastoff>
  <!-- Bump ?v= on every deploy. GitHub Pages caches assets, so without this a
       visitor who loaded a bad build keeps it until their cache expires. -->
  <script src="./blastoff-element.js?v=4"></script>
</body>
</html>
