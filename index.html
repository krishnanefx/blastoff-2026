<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141414">

  <title>BlastOff! 2026 — to new horizons!</title>
  <meta name="description" content="BlastOff! 2026 — to new horizons! The premier career fair connecting Singaporean talent worldwide with top careers in Singapore. Friday 14 August 2026, 4pm–9pm, Suntec Convention Centre, Level 3 Summit 1. Free admission.">

  <!-- Indexable as of the blastoff2026.com cutover. The noindex that used to sit
       here was for the krishnanefx.github.io staging mirror; that host now
       301s to this domain, so there is nothing left to keep out of search. -->

  <!-- The site ships on its own domain, blastoff2026.com, so everything that has
       to be absolute is absolute. og:url and og:image cannot be relative — chat
       apps and crawlers resolve them against nothing. Links out to the council
       are fully qualified to theukssc.co.uk for the same reason: this is no
       longer a page inside that site. -->
  <link rel="canonical" href="https://blastoff2026.com/">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://blastoff2026.com/">
  <meta property="og:site_name" content="BlastOff! 2026">
  <meta property="og:title" content="BlastOff! 2026 — to new horizons!">
  <meta property="og:description" content="Friday 14 August 2026, 4pm–9pm at Suntec Convention Centre. 20+ partners. Free admission.">
  <meta property="og:image" content="https://blastoff2026.com/assets/og-blastoff-2026-v2.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="BlastOff! 2026 — to new horizons! Friday 14 August 2026, 4pm–9pm, Suntec Convention Centre.">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Google was showing the generic globe because the crest is 273x253 and it
       only accepts a SQUARE favicon, and because /favicon.ico was missing — the
       location it falls back to. Both fixed; sizes are multiples of 48 as Google
       asks. Rebuild with tools/make-favicons.py. Keep these URLs stable: Google
       recrawls favicons on its own schedule and a moved file resets the clock. -->
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" type="image/png" sizes="48x48" href="./assets/favicon-48.png">
  <link rel="icon" type="image/png" sizes="96x96" href="./assets/favicon-96.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/favicon-192.png">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="./assets/fonts/open-sauce-sans-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./assets/blastoff-wordmark.png" as="image" fetchpriority="high">

  <style>
    html, body { margin: 0; padding: 0; background: #141414; }
    ukssc-blastoff:not(:defined) { display: block; min-height: 100vh; }

    /* The skip link lives here, not in the component's shadow root. A shadow
       target is not reachable via document.getElementById, so native fragment
       navigation and auditing tools cannot resolve it. */
    .skip-link {
      position: absolute; top: 0; left: 0; z-index: 100;
      transform: translateY(-130%);
      /* Electric Lime + Black — brand deck p6, and the first sanctioned
         pairing on the Colour Usage page. */
      background: #E9FF47; color: #141414;
      padding: 14px 20px; text-decoration: none; font-weight: 700; font-size: 15px;
      font-family: 'Open Sauce Sans', system-ui, sans-serif;
      transition: transform .18s ease;
    }
    .skip-link:focus { transform: none; }
    #content:focus { outline: none; }
  </style>
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <div id="content" tabindex="-1">
    <ukssc-blastoff></ukssc-blastoff>
  </div>
  <script src="./blastoff-element.js?v=7"></script>
</body>
</html>
